<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10152a">
<title>NOVA — 3D Messenger</title>
<style>
:root{--bg:#0b1020;--panel:#111a30;--panel2:#17223b;--line:#263453;--text:#f4f7ff;--muted:#94a4c5;--blue:#6b8cff;--cyan:#66e3ff;--bubble:#202f50;--mine:#3e62cc}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 20% 0%,#1a2850 0%,#0b1020 54%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}.app{height:100vh;min-height:600px;max-width:1600px;margin:auto;padding:16px;display:grid;grid-template-columns:78px 320px minmax(0,1fr);gap:12px}.rail,.sidebar,.chat{background:#0f172beF;border:1px solid var(--line);border-radius:22px;min-height:0;box-shadow:0 20px 70px #0003}.rail{display:flex;align-items:center;flex-direction:column;padding:15px 10px;gap:18px}.brand3d{width:48px;height:48px;position:relative;display:grid;place-items:center;border-radius:16px;background:linear-gradient(145deg,#82f1ff,#617cff 60%,#a57aff);box-shadow:inset 2px 3px 5px #ffffff9c,inset -4px -5px 9px #243ca8,0 8px 22px #5475ff66;color:#fff;font-size:25px;text-shadow:0 3px 7px #192b8a}.railbtn{width:44px;height:44px;border:0;border-radius:14px;background:transparent;color:#8fa2c7;font-size:20px;cursor:pointer}.railbtn.active,.railbtn:hover{background:#263a66;color:#fff}.railbottom{margin-top:auto}.sidebar{display:flex;flex-direction:column;padding:20px 14px;overflow:hidden}.sidehead{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.brandname{font-weight:900;letter-spacing:2px;font-size:17px}.brandname span{color:var(--cyan)}.tiny{font-size:11px;color:var(--muted);margin-top:4px}.iconbtn{border:1px solid var(--line);background:#17223b;color:#dce6ff;border-radius:12px;width:38px;height:38px;cursor:pointer}.search{width:100%;background:#0b1326;border:1px solid #273657;border-radius:13px;padding:12px 13px;color:white;outline:none;margin-bottom:15px}.search:focus{border-color:var(--blue)}.filterrow{display:flex;gap:7px;margin-bottom:12px}.filter{border:1px solid transparent;background:transparent;color:var(--muted);padding:7px 10px;border-radius:9px;font-size:12px;cursor:pointer}.filter.active{background:#25365d;color:#dfe8ff;border-color:#344c82}.contactlist{overflow:auto;min-height:0}.contact{display:flex;align-items:center;gap:11px;padding:11px 9px;border-radius:15px;cursor:pointer;border:1px solid transparent;transition:.18s}.contact:hover{background:#17223b}.contact.active{background:linear-gradient(100deg,#233765,#1a2847);border-color:#354b7c}.avatar{width:46px;height:46px;flex:0 0 46px;border-radius:16px;display:grid;place-items:center;font-weight:800;font-size:16px;position:relative;overflow:hidden;box-shadow:inset 0 1px 4px #ffffff5c,0 5px 15px #0002}.avatar:after{content:"";position:absolute;width:28px;height:12px;background:#ffffff24;transform:rotate(-35deg);top:4px;left:-3px;border-radius:50%}.a1{background:linear-gradient(145deg,#ffb57d,#e55f88)}.a2{background:linear-gradient(145deg,#7ef1d3,#1b9cbd)}.a3{background:linear-gradient(145deg,#c4a1ff,#6b67dc)}.a4{background:linear-gradient(145deg,#ffd96c,#ed8a4d)}.a5{background:linear-gradient(145deg,#8dd5ff,#4e73d8)}.a6{background:linear-gradient(145deg,#ff9bb6,#a94d9d)}.contactinfo{flex:1;min-width:0}.contacttop{display:flex;align-items:center;justify-content:space-between;gap:6px}.contactname{font-size:13px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.time{font-size:10px;color:#8da0c4;white-space:nowrap}.preview{font-size:11px;color:#9baaca;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:6px}.badge{background:#5e83ff;color:white;border-radius:20px;min-width:19px;padding:3px 6px;text-align:center;font-size:10px}.online{display:inline-block;width:7px;height:7px;border-radius:50%;background:#59e6ae;margin-right:5px;box-shadow:0 0 8px #59e6ae}.chat{display:flex;flex-direction:column;overflow:hidden;position:relative;background:linear-gradient(145deg,#101a31f5,#0c1427f7)}.chathead{display:flex;align-items:center;gap:13px;padding:17px 22px;border-bottom:1px solid var(--line);background:#121c32dd}.chathead .avatar{width:44px;height:44px;flex-basis:44px}.chatperson{flex:1}.chatperson strong{font-size:14px}.chatperson small{display:block;color:#78e5bd;font-size:11px;margin-top:5px}.headactions{display:flex;gap:8px}.messages{flex:1;overflow:auto;padding:24px clamp(15px,5vw,72px);display:flex;flex-direction:column;gap:13px;background-image:radial-gradient(#91b6ff0b 1px,transparent 1px);background-size:20px 20px}.day{text-align:center;font-size:10px;letter-spacing:1.5px;color:#94a7ce;background:#182541b8;border:1px solid #2b3b5c;border-radius:20px;padding:7px 13px;align-self:center;margin:4px 0 8px}.msg{max-width:min(75%,540px);display:flex;flex-direction:column;align-self:flex-start;gap:5px;animation:pop .2s ease}.msg.mine{align-self:flex-end}.bubble{padding:12px 15px;border-radius:17px 17px 17px 5px;background:linear-gradient(135deg,#1e2d4c,#202d49);border:1px solid #2c3c5f;font-size:13px;line-height:1.55;overflow-wrap:anywhere;box-shadow:0 5px 15px #0001}.mine .bubble{background:linear-gradient(135deg,#3455ad,#3e62cc);border-color:#5777d2;border-radius:17px 17px 5px 17px}.meta{font-size:10px;color:#899cbe;display:flex;gap:5px;align-items:center;justify-content:flex-end;padding:0 4px}.ticks{color:#78e8ff;font-size:12px}.composerwrap{padding:14px 18px 17px;border-top:1px solid var(--line);background:#111a2ef0}.replyhint{display:none;font-size:11px;color:#9eb5e7;padding:0 0 8px}.composer{display:flex;align-items:flex-end;gap:9px;padding:9px 10px;background:#0a1327;border:1px solid #2b3b5c;border-radius:17px}.composer textarea{flex:1;resize:none;max-height:120px;min-height:24px;background:transparent;border:0;outline:0;color:white;font:13px/1.5 inherit;padding:5px 0}.composer textarea::placeholder{color:#7386aa}.send{height:42px;min-width:44px;border:0;border-radius:13px;background:linear-gradient(145deg,#7a9aff,#5273ef);color:white;font-size:18px;cursor:pointer;box-shadow:0 5px 16px #4265ed50}.attach{border:0;background:transparent;color:#8ea5d1;font-size:20px;padding:8px;cursor:pointer}.footnote{text-align:center;color:#617397;font-size:10px;margin-top:9px}.welcome{height:100%;display:grid;place-items:center;text-align:center;padding:30px}.orbscene{width:160px;height:160px;margin:0 auto 25px;perspective:500px;display:grid;place-items:center}.orb{width:118px;height:118px;border-radius:35%;background:linear-gradient(135deg,#7df4ff,#637dff 55%,#c48aff);box-shadow:inset 9px 8px 16px #ffffff9e,inset -15px -15px 28px #1c278f,0 0 55px #597aff72;transform:rotateX(18deg) rotateY(-25deg);animation:float 5s ease-in-out infinite;position:relative}.orb:before{content:'➤';font-size:58px;position:absolute;inset:0;display:grid;place-items:center;color:#fff;text-shadow:0 4px 12px #273baf;transform:translateX(-3px)}.welcome h1{font-size:28px;letter-spacing:-1px;margin:0 0 9px}.welcome p{color:var(--muted);font-size:13px;line-height:1.7;max-width:390px}.startbtn{margin-top:14px;border:0;background:linear-gradient(120deg,#6f91ff,#6edfff);padding:12px 18px;border-radius:12px;color:#09152e;font-weight:850;cursor:pointer}.hidden{display:none!important}.mobileback{display:none}@keyframes float{0%,100%{transform:translateY(0) rotateX(18deg) rotateY(-25deg)}50%{transform:translateY(-12px) rotateX(-4deg) rotateY(25deg)}}@keyframes pop{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}@media(max-width:900px){.app{grid-template-columns:58px 275px minmax(0,1fr);padding:8px;gap:8px}.rail{padding:12px 6px}.sidebar{padding:15px 10px}.messages{padding:20px 14px}.headactions .optional{display:none}}@media(max-width:650px){.app{height:100dvh;min-height:0;padding:0;display:block}.rail{display:none}.sidebar,.chat{position:absolute;inset:0;border-radius:0;border:0}.sidebar{padding:18px 14px}.chat{display:none}.app.chatopen .sidebar{display:none}.app.chatopen .chat{display:flex}.mobileback{display:inline-block}.chathead{padding:12px 13px}.messages{padding:18px 12px}.msg{max-width:88%}.composerwrap{padding:10px}.welcome h1{font-size:24px}}
</style></head>
<body><div class="app" id="app">
<aside class="rail"><div class="brand3d" title="NOVA">➤</div><button class="railbtn active" title="Xabarlar">▤</button><button class="railbtn" title="Kontaktlar" id="contactsBtn">♙</button><button class="railbtn" title="Qo'ng'iroqlar" onclick="notice('Qoʻngʻiroqlar keyingi versiyada')">◉</button><button class="railbtn" title="Saqlanganlar" onclick="notice('Saqlangan xabarlar tez orada')">▣</button><button class="railbtn railbottom" title="Sozlamalar" onclick="notice('Sozlamalar demo rejimida')">⚙</button></aside>
<aside class="sidebar"><div class="sidehead"><div><div class="brandname">N<span>O</span>VA <span style="font-size:10px;color:#7f91b7">3D</span></div><div class="tiny">Yangi avlod messenjeri</div></div><button class="iconbtn" title="Yangi chat" onclick="notice('Demo: kontaktni tanlab yozishni boshlang')">＋</button></div><input class="search" id="search" placeholder="⌕  Xabar yoki kontakt qidirish..." autocomplete="off"><div class="filterrow"><button class="filter active" data-filter="all">Barchasi</button><button class="filter" data-filter="unread">O'qilmagan</button><button class="filter" data-filter="online">Online</button></div><div class="contactlist" id="contactlist"></div><div class="tiny" style="padding:12px 5px 0">✦ NOVA — suhbatlaringiz uchun yangi makon</div></aside>
<main class="chat"><header class="chathead"><button class="iconbtn mobileback" id="back">‹</button><div class="avatar a2" id="headavatar">MA</div><div class="chatperson"><strong id="headname">Madinabonu</strong><small id="headstatus"><span class="online"></span>online</small></div><div class="headactions"><button class="iconbtn" title="Qidirish" onclick="document.getElementById('search').focus()">⌕</button><button class="iconbtn optional" title="Qo'ng'iroq" onclick="notice('Audio qoʻngʻiroq keyingi versiyada')">♧</button><button class="iconbtn optional" title="Ko'proq" onclick="notice('Qoʻshimcha imkoniyatlar tez orada')">⋯</button></div></header><section class="messages" id="messages"></section><div class="composerwrap"><div class="replyhint" id="replyhint">Xabar yozing…</div><form class="composer" id="form"><button type="button" class="attach" title="Emoji" id="emoji">☺</button><textarea id="input" rows="1" placeholder="Xabar yozing..." aria-label="Xabar matni"></textarea><button type="button" class="attach" title="Biriktirish" onclick="notice('Fayl yuborish haqiqiy server ulanganidan keyin ishlaydi')">⌁</button><button class="send" type="submit" title="Yuborish">➤</button></form><div class="footnote">Enter — yuborish · Shift + Enter — yangi qator</div></div></main>
</div>
<div id="toast" style="position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#e6efff;color:#10203e;border-radius:12px;padding:11px 16px;font-size:12px;font-weight:750;box-shadow:0 10px 40px #0005;opacity:0;pointer-events:none;transition:.2s;z-index:10"></div>
<script>
const people=[
{id:'madina',name:'Madinabonu',initials:'MA',avatar:'a2',online:true,time:'14:32',preview:'Ha, zoʻr fikr ekan! ✨',unread:2,messages:[{text:'Salom! Yangi ilovang qanday ketyapti? 😊',time:'14:27',mine:false},{text:'Yaxshi! NOVA degan yangi 3D messenjer dizaynini qilyapman.',time:'14:28',mine:true},{text:'Voy, juda qiziq ekan! Dizaynini koʻrsatsang boʻladimi?',time:'14:29',mine:false},{text:'Mana shu yerda sinab koʻrishing mumkin 😄',time:'14:30',mine:true},{text:'Ha, zoʻr fikr ekan! ✨',time:'14:32',mine:false}]},
{id:'aziz',name:'Azizbek',initials:'AZ',avatar:'a1',online:true,time:'14:18',preview:'Bugun uchrashamizmi?',unread:1,messages:[{text:'Salom, bugun boʻshmisan?',time:'14:12',mine:false},{text:'Ha, tushdan keyin boʻshman.',time:'14:14',mine:true},{text:'Bugun uchrashamizmi?',time:'14:18',mine:false}]},
{id:'team',name:'Dasturchilar jamoasi',initials:'DJ',avatar:'a3',online:false,time:'13:55',preview:'Jasur: build tayyor boʻldi',unread:0,messages:[{text:'Ertangi reja: interfeysni tekshiramiz.',time:'13:42',mine:false},{text:'Mobil versiyani ham sinab koʻring.',time:'13:49',mine:false},{text:'Jasur: build tayyor boʻldi',time:'13:55',mine:false}]},
{id:'sister',name:'Singlim 🌷',initials:'SI',avatar:'a6',online:true,time:'12:40',preview:'Rasmni yubordim',unread:0,messages:[{text:'Qalaysan? Bugun uyga erta kelasanmi?',time:'12:35',mine:false},{text:'Ha, harakat qilaman 💜',time:'12:37',mine:true},{text:'Rasmni yubordim',time:'12:40',mine:false}]},
{id:'bek',name:'Bekzod',initials:'BE',avatar:'a4',online:false,time:'Kecha',preview:'Rahmat, aka!',unread:0,messages:[{text:'Koddagi xatoni topdim, endi ishlayapti.',time:'Kecha',mine:false},{text:'Rahmat, aka!',time:'Kecha',mine:false}]},
{id:'nova',name:'NOVA yangiliklari',initials:'N',avatar:'a5',online:false,time:'Du',preview:'NOVA bilan tanishing 🚀',unread:0,messages:[{text:'NOVA demo-versiyasiga xush kelibsiz! 🚀 Bu interfeys hozircha sinov uchun ishlaydi.',time:'Du',mine:false}]}
];
let selected='madina',filter='all';const $=id=>document.getElementById(id);
function notice(t){const el=$('toast');el.textContent=t;el.style.opacity='1';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.style.opacity='0',2200)}
function renderContacts(){const q=$('search').value.toLowerCase();$('contactlist').innerHTML='';people.filter(p=>(p.name+' '+p.preview).toLowerCase().includes(q)&&(filter==='all'||filter==='unread'&&p.unread>0||filter==='online'&&p.online)).forEach(p=>{const el=document.createElement('div');el.className='contact'+(p.id===selected?' active':'');el.innerHTML='<div class="avatar '+p.avatar+'">'+p.initials+'</div><div class="contactinfo"><div class="contacttop"><span class="contactname">'+esc(p.name)+'</span><span class="time">'+p.time+'</span></div><div class="contacttop"><div class="preview">'+(p.online?'<span class="online"></span>':'')+esc(p.preview)+'</div>'+(p.unread?'<span class="badge">'+p.unread+'</span>':'')+'</div></div>';el.onclick=()=>choose(p.id);$('contactlist').appendChild(el)})}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function choose(id){selected=id;const p=people.find(x=>x.id===id);p.unread=0;$('headavatar').className='avatar '+p.avatar;$('headavatar').textContent=p.initials;$('headname').textContent=p.name;$('headstatus').innerHTML=p.online?'<span class="online"></span>online':'oxirgi faollik yaqinda';renderContacts();renderMessages();$('app').classList.add('chatopen');}
function renderMessages(){const p=people.find(x=>x.id===selected),box=$('messages');box.innerHTML='<div class="day">BUGUN</div>';p.messages.forEach(m=>{const el=document.createElement('div');el.className='msg'+(m.mine?' mine':'');el.innerHTML='<div class="bubble">'+esc(m.text).replace(/\n/g,'<br>')+'</div><div class="meta">'+m.time+(m.mine?'<span class="ticks">✓✓</span>':'')+'</div>';box.appendChild(el)});box.scrollTop=box.scrollHeight}
$('form').addEventListener('submit',e=>{e.preventDefault();const text=$('input').value.trim();if(!text)return;const p=people.find(x=>x.id===selected),time=new Date().toLocaleTimeString('uz-UZ',{hour:'2-digit',minute:'2-digit'});p.messages.push({text,time,mine:true});p.preview=text;p.time=time;$('input').value='';$('input').style.height='auto';renderMessages();renderContacts();});
$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('form').requestSubmit()}});
$('input').addEventListener('input',()=>{$('input').style.height='auto';$('input').style.height=Math.min($('input').scrollHeight,120)+'px'});
$('search').addEventListener('input',renderContacts);document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));renderContacts()});
$('emoji').onclick=()=>{const input=$('input');input.value+=[' 😊',' ❤️',' ✨',' 😂',' 👍'][Math.floor(Math.random()*5)];input.focus()};$('back').onclick=()=>$('app').classList.remove('chatopen');$('contactsBtn').onclick=()=>notice('Kontaktlar roʻyxati shu oynada');choose('madina');
</script></body></html>
